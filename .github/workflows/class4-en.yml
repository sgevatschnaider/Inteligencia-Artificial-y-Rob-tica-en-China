name: Build Class 4 English materials
on:
  push:
    branches: [main]
    paths:
      - "materiales/clase-4/**"
      - "scripts/build_class4_en.py"
      - "scripts/render_class4_editorial.mjs"
      - "scripts/export_class4_editorial.py"
      - "scripts/verify_class4_editorial.py"
      - "scripts/verify_class4_en.py"
      - "scripts/check_class4_models.mjs"
      - "scripts/check_class4_en_browser.cjs"
      - "tests/test_class4_en.py"
      - ".github/workflows/class4-en.yml"
      - "qa/class4-en/**"
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-pptx pillow reportlab pypdf
      - name: Build English decks, PDFs, covers and labs
        run: python scripts/build_class4_en.py
      - name: Validate generated English materials
        run: |
          python -m unittest discover -s tests -p 'test_class4_en.py'
          python scripts/verify_class4_en.py
          python scripts/validate_repo.py
          CLASS4_LANGUAGE=en node scripts/check_class4_models.mjs
      - name: Confirm the authored native decks and web files are committed
        run: git diff --exit-code -- materiales/clase-4
      - name: Preserve quality-control results
        uses: actions/upload-artifact@v4
        with:
          name: class4-english-quality-control
          path: qa/class4-en

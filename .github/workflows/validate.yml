name: Validate repository

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bilingual-content:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate links and bilingual structure
        run: python scripts/validate_repo.py
      - name: Check site and research reader JavaScript
        run: |
          node --check lecturas/reader.js
          node --check materiales/dragon/viewer.js
          node --check materiales/androide/viewer.js
          node --check materiales/infraestructura/viewer.js
          node --check materiales/clase-2/common.js
          node --check materiales/clase-2/reader.js
          node --check materiales/clase-2/lab.js
          node --check materiales/clase-2/videos.js
          node materiales/clase-2/tests/model.test.cjs
          node --check scripts/check_infraestructura.cjs
          node --check scripts/check_androide.cjs
          node scripts/check_site.cjs
      - name: Install browser smoke-test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chrome
      - name: Test interactive resources and video playback in Chrome
        env:
          DRAGON_SCREENSHOT_DIR: artifacts/dragon
          ANDROIDE_SCREENSHOT_DIR: artifacts/androide
          INFRAESTRUCTURA_SCREENSHOT_DIR: artifacts/infraestructura
          CLASS2_SCREENSHOT_DIR: artifacts/clase-2
        run: |
          node scripts/browser_smoke.cjs
          node scripts/check_dragon.cjs
          node scripts/check_androide.cjs
          node scripts/check_infraestructura.cjs
          node scripts/check_class2.cjs
      - name: Preserve Dragon browser review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dragon-browser-review
          path: artifacts/dragon
          if-no-files-found: ignore
      - name: Preserve Android browser review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androide-browser-review
          path: artifacts/androide
          if-no-files-found: ignore
      - name: Preserve Infrastructure browser review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infraestructura-browser-review
          path: artifacts/infraestructura
          if-no-files-found: ignore
      - name: Preserve class 2 browser review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class2-browser-review
          path: artifacts/clase-2
          if-no-files-found: ignore
      - name: Install PDF validation tools
        run: python -m pip install --disable-pip-version-check pypdf
      - name: Verify all 47 pages and slides in both PDF and PowerPoint files
        run: |
          python scripts/verify_decks.py
          python scripts/verify_dragon.py
          python scripts/verify_androide.py
          python scripts/verify_infraestructura.py
          python scripts/verify_class2.py
      - name: Validate model behavior and indicator sources
        run: node scripts/check_models.cjs

name: Validate repository

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bilingual-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate links and bilingual structure
        run: python scripts/validate_repo.py
      - name: Check site and research reader JavaScript
        run: |
          node --check lecturas/reader.js
          node scripts/check_site.cjs
      - name: Install PDF validation tools
        run: python -m pip install --disable-pip-version-check pypdf
      - name: Verify all 47 pages and slides in both PDF and PowerPoint files
        run: python scripts/verify_decks.py
      - name: Validate model behavior and indicator sources
        run: node scripts/check_models.cjs

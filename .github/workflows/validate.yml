name: Validate repository

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bilingual-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate links and bilingual structure
        run: python scripts/validate_repo.py
      - name: Validate model behavior and indicator sources
        run: node scripts/check_models.cjs

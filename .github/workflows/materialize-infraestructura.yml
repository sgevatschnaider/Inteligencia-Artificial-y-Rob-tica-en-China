name: Materialize Infrastructure module
on:
  push:
    branches: [main]
    paths:
      - 'materiales/infraestructura/paquete/**'
      - 'scripts/unpack_infraestructura.py'
      - '.github/workflows/materialize-infraestructura.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-infraestructura
  cancel-in-progress: false

jobs:
  restore-source-files:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore all 32 source slides and downloads
        run: python scripts/unpack_infraestructura.py
      - name: Inspect source and generated assets
        run: |
          python -m pip install --disable-pip-version-check pypdf
          python scripts/verify_infraestructura.py
      - name: Commit expanded PDF, PowerPoint, images, metadata and sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add materiales/infraestructura/
          git rm -r --ignore-unmatch materiales/infraestructura/paquete
          if ! git diff --cached --quiet; then
            git commit -m 'Materializar La infraestructura: PPTX, PDF, 32 láminas, notas y fuentes'
            git push origin HEAD:main
          fi
